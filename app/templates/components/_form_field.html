{% set name=col.Field %}{% set typ=col.Type.lower() %}<div class="col-md-6 col-xl-4"><label class="form-label fw-medium" for="field-{{ name }}">{{ labels.get(name,name|replace('_',' ')|capitalize) }}</label>{% if 'text' in typ %}<textarea class="form-control" id="field-{{ name }}" rows="2" name="{{ name }}">{{ item.get(name,'') if item else '' }}</textarea>{% else %}<input class="form-control" id="field-{{ name }}" name="{{ name }}" value="{{ item.get(name,'') if item else '' }}" {% if 'date' in typ %}type="date"{% elif 'decimal' in typ or 'int' in typ or 'float' in typ %}type="number" step="any"{% elif 'email' in name.lower() %}type="email"{% else %}type="text"{% endif %} {% if col.Null=='NO' and col.Default is none %}required{% endif %}>{% endif %}<div class="form-text">{{ col.Type }}</div></div>
