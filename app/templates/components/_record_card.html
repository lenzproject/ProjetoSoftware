<article class="record-card h-100"><div class="d-flex justify-content-between align-items-start gap-2 mb-3"><div><span class="text-secondary small">Registro #{{ row.id }}</span><h2 class="h6 fw-bold mb-0 mt-1">{{ row.get(display) or 'Sem descrição' }}</h2></div></div><div class="record-secondary mb-3"><span class="text-secondary small">{{ labels.get(secondary,secondary|replace('_',' ')|capitalize) }}</span><div class="fw-medium">{{ row.get(secondary) or '—' }}</div></div><div class="d-flex gap-2 mt-auto"><a class="btn btn-sm btn-outline-primary flex-fill" href="{{ url_for('registry.form',module=module,row_id=row.id) }}"><i class="bi bi-pencil me-1"></i>Editar</a><form method="post" action="{{ url_for('registry.delete',module=module,row_id=row.id) }}" onsubmit="return confirm('Confirma a exclusão deste registro?')"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Excluir</button></form></div></article>
