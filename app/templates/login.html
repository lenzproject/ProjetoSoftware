{% extends 'base.html' %}{% block title %}Entrar{% endblock %}{% block public %}<div class="login-wrap"><div class="login-card"><div class="text-center mb-4"><div class="brand-icon"><i class="bi bi-receipt-cutoff"></i></div><h1 class="h3 fw-bold mt-3">Fiscal</h1><p class="text-secondary">Gestão integrada</p></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('auth.authenticate') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="email">Usuário / e-mail</label><input id="email" class="form-control form-control-lg" name="email" required autocomplete="username"></div><div class="mb-4"><label class="form-label" for="password">Senha</label><input id="password" class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-lg w-100">Entrar</button></form></div></div>{% endblock %}
